name: YouTube Resume Knowledge Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'keywords.txt'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수집 및 분석 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_dataset.py

      - name: 결과 파일 저장소에 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 파일이 실제로 존재할 때만 git add 수행 (에러 방지)
          [ -f resume_youtube_knowledge.xlsx ] && git add resume_youtube_knowledge.xlsx
          [ -f resume_youtube_knowledge.jsonl ] && git add resume_youtube_knowledge.jsonl
          [ -f processed_ids.json ] && git add processed_ids.json
          
          # 스테이징된 변경사항이 있을 때만 커밋 및 푸시 진행
          if ! git diff --staged --quiet; then
            git commit -m "auto: 유튜브 인기 영상 데이터 자동 누적"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "[-] 저장할 새로운 변경 데이터가 없습니다."
          fi
