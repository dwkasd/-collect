name: 2022년~현재 핵심뉴스 1000개 수집

on:
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl lxml

      - name: 1000개 기사 수집 파이썬 스크립트 실행
        run: python collect_1000_historical.py

      # ⭐ 이 아래 부분이 없으면 엑셀 파일이 가상머신 종료 시 사라집니다! ⭐
      - name: 생성된 엑셀 파일 저장소에 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add accumulated_news.xlsx
          git commit -m "Auto: 2022~현재 핵심뉴스 1000개 수집 완료" || echo "No changes to commit"
          git push
