name: YouTube Resume Knowledge Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'keywords.txt'

# ▼ 저장소 파일 수정(Commit & Push) 권한 부여
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 수집 및 분석 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python build_dataset.py

      - name: 결과 파일 저장소에 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resume_youtube_knowledge.xlsx resume_youtube_knowledge.jsonl processed_ids.json
          git diff --staged --quiet || git commit -m "auto: 유튜브 인기 영상 데이터 자동 누적"
          git push
